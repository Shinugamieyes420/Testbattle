name: Build Neon Maze APK

on:
  push:
    branches:
      - neon-maze-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reconstruct Godot script
        shell: bash
        run: |
          cat neon_maze_android/main_parts/part_*.txt > neon_maze_android/main.gd
          # Godot 4.7's strict inference rejects := when Dictionary/Variant values are involved.
          # Dynamic declarations are appropriate here because actors are Dictionaries.
          sed -i 's/:=/=/g' neon_maze_android/main.gd
          test -s neon_maze_android/main.gd
          echo "main.gd lines: $(wc -l < neon_maze_android/main.gd)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Export Android APK with Godot 4.7.1
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./neon_maze_android/
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Locate APK
        shell: bash
        run: |
          echo "APK candidates:"
          find . -type f -name '*.apk' -print
          APK=$(find . -type f -name 'NeonMazeMuncher.apk' -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find . -type f -name '*.apk' -print -quit)
          fi
          test -n "$APK"
          mkdir -p final_apk
          cp "$APK" final_apk/NeonMazeMuncher.apk
          ls -lh final_apk/NeonMazeMuncher.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonMazeMuncher-Android-APK
          path: final_apk/NeonMazeMuncher.apk
          if-no-files-found: error
          retention-days: 7

# Godot strict typing + Android ETC2 retry
